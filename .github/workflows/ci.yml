# Sprint 4 — Integración continua: estilo, análisis estático, compilación y dependencias.
# Las pruebas unitarias, de integración y E2E se ejecutan en tests.yml.
name: ECO - CI

on:
  push:
    branches: [main, develop, sprint-4]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-backend:
    name: Backend · ruff y compilación Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar linter fijado con hashes
        run: python -m pip install --only-binary=:all: --require-hashes -r .github/requirements-lint.lock
      - name: Análisis estático (pyflakes, sintaxis, bugbear)
        working-directory: src/backend
        run: ruff check . --output-format github
      - name: Compilar todos los módulos del backend y scripts
        run: python -m compileall -q src/backend/app src/backend/alembic scripts

  lint-frontend:
    name: Frontend · ESLint y TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Instalar dependencias exactas del lock
        run: npm ci --ignore-scripts
      - name: ESLint (aplicación y suite E2E) y verificación de tipos E2E
        run: npm run lint

  dependencies:
    name: Validación de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Backend · instalar con hashes y comprobar coherencia
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r src/backend/requirements-dev.lock
          python -m pip check
      - name: Backend · pip-audit sobre el árbol bloqueado (entorno aislado)
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --only-binary=:all: --require-hashes -r .github/requirements-audit.lock
          "$RUNNER_TEMP/audit/bin/python" -m pip_audit -r src/backend/requirements-dev.lock --format json --output python-audit.json --progress-spinner off
      - name: Frontend · lock coherente y árbol sin conflictos
        working-directory: src/frontend
        run: |
          npm ci --ignore-scripts
          npm ls --all > /dev/null
      - name: Frontend · npm audit (high/critical) con excepciones caducables
        working-directory: src/frontend
        run: |
          npm audit --json > npm-audit.json || true
          python3 ../../scripts/check_npm_audit.py npm-audit.json
      - name: Conservar evidencias de auditoría
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: |
            python-audit.json
            src/frontend/npm-audit.json
          if-no-files-found: warn

  build-backend:
    name: Backend · imagen Docker y arranque Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir la imagen de producción del backend
        run: docker build --tag ecologistica-backend-check:ci src/backend
      - name: Verificar la sintaxis del script de arranque de Render
        run: docker run --rm --entrypoint sh ecologistica-backend-check:ci -n /app/start_render.sh
      - name: Importar la aplicación FastAPI dentro de la imagen
        run: >-
          docker run --rm -e DATABASE_URL=sqlite:///tmp/test_import.db --entrypoint python
          ecologistica-backend-check:ci -c "from app.main import app; print(app.title, app.version)"

  build-frontend:
    name: Frontend · build de producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Guardián de imágenes, TypeScript, Vite, prerender y precompresión
        run: npm run build
      - name: Conservar frontend compilado para el despliegue del mismo commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: src/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  repository:
    name: Repositorio · enlaces, Compose y staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Comprobar enlaces Markdown (README ↔ documentación)
        run: python3 scripts/check_markdown_links.py
      - name: Rechazar archivos residuales y artefactos versionados
        run: |
          if git ls-files | grep -E '(~$|(^|/)node_modules/|(^|/)\.env$|(^|/)playwright-report/|(^|/)test-results/|(^|/)dist/)'; then
            echo '::error::Hay archivos que .gitignore debe excluir'; exit 1
          fi
      - name: Validar Docker Compose de desarrollo y staging (sin iniciar servicios)
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.staging.example -f docker-compose.staging.yml config --quiet
      - name: Verificar build estático de staging
        run: docker build --file src/frontend/Dockerfile.staging --tag ecologistica-staging-check:ci src/frontend
