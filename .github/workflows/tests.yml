# Sprint 4 — Pruebas automatizadas: unitarias, integración PostgreSQL y E2E Playwright
# (Chromium, Firefox y WebKit en modo headless). Los reportes se conservan como artifacts.
# El job programado monitorea producción con las pruebas de solo lectura @public.
name: ECO - Tests

on:
  push:
    branches: [main, develop, sprint-4]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 */6 * * *' # cada 6 horas: disponibilidad y Web Vitals de producción
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-unit:
    name: Backend · pytest SQLite y cobertura ≥ 80 %
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.lock
      - name: Instalar dependencias con hashes
        run: python -m pip install --only-binary=:all: --require-hashes -r src/backend/requirements-dev.lock
      - name: Pruebas de scripts de soporte (CD, auditorías, enlaces) con cobertura
        run: |
          python -m coverage run --source=scripts -m unittest discover -s scripts -p 'test_*.py'
          python -m coverage xml -o coverage-scripts.xml
      - name: Pruebas unitarias y de API del backend
        working-directory: src/backend
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=pytest-junit.xml --cov-fail-under=80
      - name: Conservar reportes del backend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-backend
          path: |
            src/backend/coverage.xml
            src/backend/pytest-junit.xml
            coverage-scripts.xml
          if-no-files-found: warn

  backend-postgres:
    name: Backend · integración PostgreSQL 16 y migraciones
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecologistica_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ecologistica_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecologistica_test -d ecologistica_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecologistica_test:ci-test-only@127.0.0.1:5432/ecologistica_test
      DATABASE_URL: postgresql+psycopg://ecologistica_test:ci-test-only@127.0.0.1:5432/ecologistica_test
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.lock
      - run: python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock
      - name: Suite completa contra PostgreSQL aislado
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Migraciones Alembic sobre base vacía y verificación del head
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic check

  frontend-unit:
    name: Frontend · Vitest y cobertura
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Pruebas de componentes, hooks y cliente HTTP
        run: npm run test:coverage
      - name: Pruebas de los scripts de build
        run: node --test scripts/check-images.test.mjs
      - name: Conservar cobertura frontend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-frontend
          path: src/frontend/coverage/lcov.info
          if-no-files-found: error

  e2e:
    name: E2E Playwright · ${{ matrix.browser }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecologistica_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ecologistica_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecologistica_test -d ecologistica_e2e_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_PYTHON: python
      E2E_SKIP_BUILD: '1'
      E2E_DATABASE_URL: postgresql+psycopg://ecologistica_test:ci-test-only@127.0.0.1:5432/ecologistica_e2e_test
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/backend/requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Instalar backend (hashes) y frontend (lock)
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r ../backend/requirements-dev.lock
          npm ci --ignore-scripts
      - name: Instalar ${{ matrix.browser }} y sus dependencias del sistema
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build de producción que se servirá con vite preview
        run: npm run build
      - name: Ejecutar la suite E2E headless (API real + PostgreSQL + Alembic)
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Publicar métricas en el resumen del job
        if: always()
        run: npm run e2e:metrics
      - name: Conservar reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: src/frontend/playwright-report/
          if-no-files-found: error
          retention-days: 30
      - name: Conservar resultados, métricas y trazas de fallos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: src/frontend/test-results/
          if-no-files-found: warn
          retention-days: 30

  production-monitor:
    name: Monitoreo de producción · Playwright @public
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.FRONTEND_URL || 'https://ecologistica-lima.vercel.app' }}
      E2E_API_URL: ${{ vars.BACKEND_URL || 'https://ecologistica-lima-api-ktea.onrender.com' }}
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Despertar la API (Render free suspende el servicio inactivo)
        working-directory: .
        run: |
          start=$(date +%s)
          curl --silent --show-error --fail --max-time 120 --retry 3 --retry-all-errors "$E2E_API_URL/health"
          echo "Arranque en frío/caliente: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pruebas de solo lectura sobre producción
        run: npx playwright test --project=chromium --workers=1
      - name: Publicar métricas en el resumen del job
        if: always()
        run: npm run e2e:metrics
      - name: Conservar reporte del monitoreo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-monitor-${{ github.run_id }}
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          if-no-files-found: warn
          retention-days: 30

  sonarcloud:
    name: SonarQube Cloud y quality gate
    needs: [backend-unit, frontend-unit]
    if: github.repository == 'RodrigoAC12/Ecolog-stica_Lima' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cobertura-backend
          path: coverage-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cobertura-frontend
          path: src/frontend/coverage
      - name: Ubicar cobertura donde la espera sonar-project.cloud.properties
        run: |
          cp coverage-artifacts/src/backend/coverage.xml src/backend/coverage.xml
          cp coverage-artifacts/coverage-scripts.xml coverage-scripts.xml
      - name: Analizar código completo e importar cobertura
        id: scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dproject.settings=sonar-project.cloud.properties
      - name: Exportar evidencia del análisis de esta revisión
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 scripts/export_sonarcloud_report.py
      - name: Conservar evidencia Cloud
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonarcloud-report
          path: sonarcloud-report.json
          if-no-files-found: warn
